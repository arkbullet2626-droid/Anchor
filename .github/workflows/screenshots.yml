name: Website screenshots

# Renders Anchor's real tray menu and Settings window on a clean Windows machine,
# so no personal windows, files or names can appear. Download the "screenshots" artifact.
on:
  push:
    branches: [main]
    paths:
      - 'tools/Screenshots/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Render
        shell: pwsh
        run: |
          dotnet build tools/Screenshots/Screenshots.csproj -c Release
          $exe = Get-ChildItem tools/Screenshots/bin/Release -Recurse -Filter Screenshots.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList "$PWD\screenshots" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Screenshot tool hung" }
          if ($p.ExitCode -ne 0) { throw "Screenshot tool failed ($($p.ExitCode))" }
          Get-ChildItem screenshots | ForEach-Object { "$($_.Name): $($_.Length) bytes" }
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png

      # Keep them in the repo so the website can use stable public links (docs/screenshots/...).
      - name: Commit to docs/screenshots
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/screenshots | Out-Null
          Copy-Item screenshots/*.png docs/screenshots/ -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { "No changes"; exit 0 }
          git commit -m "Update website screenshots [skip ci]"
          git pull --rebase -q origin main
          git push origin HEAD:main
